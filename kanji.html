<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N4 Kanji with Examples</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-jlpt sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">JLPT Study Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="kanji.html">Kanji Study</a></li>
          <li class="nav-item"><a class="nav-link" href="game.html">Kanji Game</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">N2 Mock Test</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <div class="text-center mb-3">
      <h1 class="h2" style="color:var(--jlpt-indigo)">JLPT N4 Kanji with Examples</h1>
      <p class="text-muted" id="kanjiCounter">Card 1</p>
    </div>
    <div class="kanji-card-panel text-center mb-4">
      <p class="kanji-display mb-3" id="kanjiChar">終</p>
      <p class="reading-pill" id="kanjiReading">---</p>
      <div class="row g-3 mt-2 text-start">
        <div class="col-md-4"><small class="text-muted">English</small><p id="meaningEn" class="mb-0 fw-semibold">-</p></div>
        <div class="col-md-4"><small class="text-muted">Nepali</small><p id="meaningNe" class="mb-0 fw-semibold">-</p></div>
        <div class="col-md-4"><small class="text-muted">Vietnamese</small><p id="meaningVi" class="mb-0 fw-semibold">-</p></div>
      </div>
      <div class="example-box text-start mt-4">
        <p class="mb-1" id="kanjiExample"></p>
        <p class="mb-0 text-muted" id="kanjiExampleNe"></p>
      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <button type="button" class="btn btn-jlpt-outline" id="btnPrev">Previous</button>
      <span id="kanjiProgress" class="text-muted">1 / 20</span>
      <button type="button" class="btn btn-jlpt-primary" id="btnNext">Next</button>
    </div>
    <div class="progress progress-kanji mt-3"><div class="progress-bar bg-primary" id="kanjiProgressBar" style="width:5%"></div></div>
  </main>
  <footer class="footer-jlpt"><div class="container text-center small"><p class="mb-0"><a href="game.html" class="text-white">Play Kanji Game</a></p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/kanji-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/kanji-app.js"></script>
</body>
</html>
