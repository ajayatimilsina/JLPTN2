<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N2 Mock Test July 2024</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-jlpt sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">JLPT Study Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="kanji.html">Kanji Study</a></li>
          <li class="nav-item"><a class="nav-link" href="game.html">Kanji Game</a></li>
          <li class="nav-item"><a class="nav-link active" href="test.html">N2 Mock Test</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid py-4 px-lg-4">
  <div class="row g-4">
    <div class="col-lg-3">
      <aside class="test-sidebar p-3">
        <h2 class="h6 text-uppercase text-muted">JLPT N2 July 2024</h2>
        <p class="small mb-2">Timer <span class="test-timer" id="testTimer">105:00</span></p>
        <div id="qNavGrid" class="d-flex flex-wrap gap-1 mb-3"></div>
        <button type="button" class="btn btn-jlpt-primary w-100 mb-2" id="btnSubmit">Submit Test</button>
        <button type="button" class="btn btn-outline-secondary w-100 btn-sm" id="btnReset">Reset</button>
      </aside>
    </div>
    <div class="col-lg-9">
      <div class="question-panel mb-3">
        <p class="small text-muted mb-1" id="qGroup"></p>
        <h1 class="h4" id="qNumber">Question 1</h1>
        <p class="small fst-italic" id="qInstruction"></p>
        <div class="passage-block d-none mb-3" id="qPassage"></div>
        <p class="fw-semibold mb-3" id="qText"></p>
        <div id="qChoices"></div>
        <div class="d-flex justify-content-between mt-4">
          <button type="button" class="btn btn-jlpt-outline" id="btnPrevQ">Previous</button>
          <button type="button" class="btn btn-jlpt-primary" id="btnNextQ">Next</button>
        </div>
      </div>
      <div class="results-dashboard p-4 d-none" id="resultsPanel">
        <h2 class="h5">Practice Results</h2>
        <div id="scoreText"></div>
      </div>
    </div>
  </div>
  </main>
  <footer class="footer-jlpt"><div class="container text-center small"><p class="mb-0">Based on Nihonez JLPT N2 July 2024 format</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/test-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/test-app.js"></script>
</body>
</html>
