<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Kanji Master N4-N1</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-jlpt sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">JLPT Study Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="kanji.html">Kanji Study</a></li>
          <li class="nav-item"><a class="nav-link active" href="game.html">Kanji Game</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">N2 Mock Test</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3 mb-3" style="color:var(--jlpt-indigo)">JLPT Kanji Master (N4-N1)</h1>
    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="game-hud"><small>Score</small><p class="h3 mb-0" id="scoreVal">0</p></div></div>
      <div class="col-md-4"><div class="game-hud"><small>Best</small><p class="h3 mb-0" id="bestVal">0</p></div></div>
      <div class="col-md-4"><div class="game-hud"><small id="gameHint">Target: N4</small><p class="display-4 mb-0 text-center" id="targetKanji">?</p></div></div>
    </div>
    <div class="btn-group mb-3 flex-wrap" role="group">
      <button type="button" class="btn btn-outline-primary level-btn active" data-level="N4">N4</button>
      <button type="button" class="btn btn-outline-primary level-btn" data-level="N3">N3</button>
      <button type="button" class="btn btn-outline-primary level-btn" data-level="N2">N2</button>
      <button type="button" class="btn btn-outline-primary level-btn" data-level="N1">N1</button>
    </div>
    <div class="game-canvas-wrap mb-3"><canvas id="gameCanvas" height="420"></canvas></div>
    <div class="card border-0 shadow-sm"><div class="card-body">
      <p class="mb-1"><strong>English:</strong> <span id="gameEn">-</span></p>
      <p class="mb-1"><strong>Nepali:</strong> <span id="gameNe">-</span></p>
      <p class="mb-1"><strong>Vietnamese:</strong> <span id="gameVi">-</span></p>
      <p class="mb-2"><strong>Example:</strong> <span id="gameExample">-</span></p>
      <p class="mb-0" id="gameStatus">Click the ball with the correct reading. +10 points.</p>
    </div></div>
  </main>
  <footer class="footer-jlpt"><div class="container text-center small"><p class="mb-0">Wrong answer resets score</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/kanji-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/game-app.js"></script>
</body>
</html>
